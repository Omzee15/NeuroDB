name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync package.json version to release tag
        shell: bash
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          VERSION="${VERSION#V}"
          # Pad incomplete semver (e.g. "1.1" -> "1.1.0") so npm version accepts it
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION="${MAJOR:-0}.${MINOR:-0}.${PATCH:-0}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Building as version $VERSION"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Electron app for macOS
        if: matrix.os == 'macos-latest'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: npm run build -- --mac --x64 --arm64

      - name: Build Electron app for Windows
        if: matrix.os == 'windows-latest'
        run: npm run build -- --win --x64

      - name: Build Electron app for Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run build -- --linux --x64

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*.AppImage

      - name: Upload release assets to public releases repository
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repository: Omzee15/NeuroDB-releases
          tag_name: ${{ github.ref_name }}
          name: NeuroDB ${{ github.ref_name }}
          body: |
            ## NeuroDB ${{ github.ref_name }}
            
            Download the appropriate version for your platform:
            
            ### macOS
            - Intel Mac: `NeuroDB-*.dmg`
            - Apple Silicon: `NeuroDB-*-arm64.dmg`
            
            ### Windows
            - `NeuroDB-Setup-*.exe`
            
            ### Linux
            - `NeuroDB-*.AppImage`
            
            ---
            [View Source Code](https://github.com/Omzee15/NeuroDB)
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
