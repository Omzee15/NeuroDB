name: Build and Release

on:
  release:
    types: [created]

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build macOS app
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload macOS DMG (x64)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/NeuroDB-${{ github.event.release.tag_name }}-x64.dmg
          asset_name: NeuroDB-${{ github.event.release.tag_name }}-mac-x64.dmg
          asset_content_type: application/octet-stream
      
      - name: Upload macOS DMG (arm64)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/NeuroDB-${{ github.event.release.tag_name }}-arm64.dmg
          asset_name: NeuroDB-${{ github.event.release.tag_name }}-mac-arm64.dmg
          asset_content_type: application/octet-stream
      
      - name: Upload macOS ZIP (x64)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/NeuroDB-${{ github.event.release.tag_name }}-x64-mac.zip
          asset_name: NeuroDB-${{ github.event.release.tag_name }}-mac-x64.zip
          asset_content_type: application/zip
      
      - name: Upload macOS ZIP (arm64)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/NeuroDB-${{ github.event.release.tag_name }}-arm64-mac.zip
          asset_name: NeuroDB-${{ github.event.release.tag_name }}-mac-arm64.zip
          asset_content_type: application/zip
